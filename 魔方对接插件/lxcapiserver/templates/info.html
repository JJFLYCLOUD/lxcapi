<div class="container-fluid">
    {if $reset_notice}
    <div class="alert alert-{$reset_notice_type} shadow-sm mb-3">
        <i class="fas fa-info-circle mr-1"></i> {$reset_notice}
    </div>
    {/if}

    {if $traffic_reset_enabled}
    <div class="card shadow mb-3">
        <div class="card-header py-2">
            <h6 class="m-0 font-weight-bold text-primary">
                <i class="fas fa-sync-alt mr-2"></i>流量重置
            </h6>
        </div>
        <div class="card-body py-3">
            {if $has_pending}
            <div class="d-flex align-items-center">
                <button type="button" class="btn btn-warning px-4" onclick="continueResetPay();">
                    <i class="fas fa-credit-card mr-2"></i>继续支付重置账单
                </button>
                <span class="ml-3 text-muted" style="font-size: 13px;">
                    <i class="fas fa-info-circle mr-1"></i>
                    已生成待支付的重置账单，点击前往支付。
                </span>
            </div>
            {else}
            <div class="d-flex align-items-center">
                <button type="button" class="btn btn-danger px-4" onclick="resetTraffic();">
                    <i class="fas fa-sync-alt mr-2"></i>重置流量
                </button>
                <span class="ml-3 text-muted" style="font-size: 13px;">
                    <i class="fas fa-info-circle mr-1"></i>
                    需支付 ¥{$reset_price}，支付成功后自动重置已用流量，到期时间不变。
                </span>
            </div>
            {/if}
        </div>
    </div>
    {/if}

    {if $iframe_url}
    <div class="card shadow mb-3">
        <div class="card-header py-2">
            <h6 class="m-0 font-weight-bold text-primary">
                <i class="fas fa-desktop mr-2"></i>容器管理
            </h6>
        </div>
        <div class="card-body p-0">
            <iframe 
                id="container-iframe" 
                src="{$iframe_url}" 
                style="width: 100%; height: 80vh; border: none; display: block;"
                frameborder="0"
                scrolling="auto">
            </iframe>
        </div>
    </div>
    {/if}

    <div class="card shadow">
        <div class="card-header py-2">
            <h6 class="m-0 font-weight-bold text-primary">
                <i class="fas fa-external-link-alt mr-2"></i>容器面板
            </h6>
        </div>
        <div class="card-body py-3">
            {if $error_msg}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-triangle"></i> {$error_msg}
            </div>
            {elseif $jump_url}
            <div class="d-flex align-items-center">
                <a href="{$jump_url}" 
                   target="_blank" 
                   class="btn btn-primary px-4">
                    <i class="fas fa-external-link-alt mr-2"></i>进入独立面板
                </a>
                <span class="ml-3 text-muted" style="font-size: 13px;">
                    <i class="fas fa-info-circle mr-1"></i>
                    点击按钮将在新窗口打开容器管理面板。
                </span>
            </div>
            {/if}
        </div>
    </div>
</div>

<script>
    function resetTraffic() {
        if (!confirm('确认支付 ¥{$reset_price} 重置本月已用流量？')) {
            return;
        }
        fetch('{$MODULE_CUSTOM_API}', {
            method: 'post',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8'
            },
            body: 'func=ResetTraffic'
        }).then(function (resp) {
            return resp.json();
        }).then(function (data) {
            var invoiceid = (data.data && data.data.invoiceid) || data.invoiceid;
            if (invoiceid) {
                location.href = 'viewbilling?id=' + invoiceid;
            } else {
                alert(data.msg || '操作失败');
            }
        }).catch(function () {
            alert('请求失败，请稍后重试');
        });
    }

    function continueResetPay() {
        var invoiceid = {$pending_invoiceid};
        if (invoiceid) {
            location.href = 'viewbilling?id=' + invoiceid;
        } else {
            location.reload();
        }
    }
</script>

<style>
.card {
    border: none;
}
.card-header {
    background-color: #f8f9fc;
    border-bottom: 1px solid #e3e6f0;
}
.btn-primary {
    background-color: #2563eb;
    border-color: #2563eb;
    transition: all 0.3s ease;
}
.btn-primary:hover {
    background-color: #1d4ed8;
    border-color: #1d4ed8;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
}
</style>
