# 系统配置
system:
  # 服务器配置
  server:
    # 监听地址
    host: "0.0.0.0"
    # 监听端口
    port: __SERVER_PORT__
    # TLS/HTTPS配置
    tls:
      # 启用HTTPS
      enabled: true
      # 证书文件路径
      cert_file: "certs/server.crt"
      # 私钥文件路径
      key_file: "certs/server.key"
      # 自动生成自签名证书(当证书不存在时)
      auto_generate: true
  
  # 安全配置
  security:
    # 系统级API密钥
    api_hash: "__API_HASH__"
  
  # 日志配置
  logger:
    # 日志级别: debug/release（debug 同时开启 Gin 调试输出）
    level: "release"
    # 启用彩色输出
    colorful: true
  
  # 数据库配置
  database:
    # 数据库类型: sqlite/mysql/postgres
    type: "__DB_TYPE__"
    # SQLite配置
    sqlite:
      path: "lxcapi.db"
    # MySQL/MariaDB配置
    mysql:
      host: "__MYSQL_HOST__"
      port: __MYSQL_PORT__
      user: "__MYSQL_USER__"
      password: "__MYSQL_PASSWORD__"
      database: "__MYSQL_DATABASE__"
    # PostgreSQL配置
    postgres:
      host: "__POSTGRES_HOST__"
      port: __POSTGRES_PORT__
      user: "__POSTGRES_USER__"
      password: "__POSTGRES_PASSWORD__"
      database: "__POSTGRES_DATABASE__"
      sslmode: "__POSTGRES_SSLMODE__"

# Incus配置
lxc:
  # Incus Socket路径（留空则使用 /var/lib/incus/unix.socket）
  socket: "/var/lib/incus/unix.socket"
  # 默认存储池(留空则使用 default)
  storage: "default"
  # 默认网桥名称(留空则使用 incusbr0)
  bridge: "incusbr0"

# 网络配置
network:
  # nftables规则重建完成后执行的命令(通过sh -c执行，留空不执行)
  start_post_command: ""

# 流量监控配置
traffic:
  # 采集间隔(秒)，每个容器之间间隔
  interval: __TRAFFIC_INTERVAL__

# 异步任务配置
task:
  # Worker数量
  workers: 4
  # 队列大小
  queue_size: 1000
  # 任务超时(秒)
  timeout: 600
  # 自动清理已完成任务(天数, 0表示不清理)
  auto_cleanup_days: 7

# 管理员配置
admin:
  # 管理员用户名
  username: "__ADMIN_USER__"
  # 管理员密码(首次使用请修改)
  password: "__ADMIN_PASS__"
  # Session密钥(请修改为随机字符串)
  session_secret: "__SESSION_SECRET__"
  # 管理面板访问路径(留空或 / 则使用 /admin)
  # 例如填 "/test" 后，访问 https://域名/test 即为管理员登录页
  path: "/admin"

# 插件配置
plugins:
  # Nginx反向代理插件
  nginx:
    enabled: __NGINX_ENABLED__

